name: Regular preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regular:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --extra proof
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked soroemono build
      - run: uv run --locked soroemono check
      - run: uv run --locked soroemono fetch-baseline
      - run: uv run --locked soroemono proof
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked soroemono capture
      - uses: actions/upload-artifact@v7
        with:
          name: soroemono-regular-preview-linux
          path: |
            build/preview/
            build/proofs/
          if-no-files-found: error
          retention-days: 14

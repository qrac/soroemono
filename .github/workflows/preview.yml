name: SOROEMONO 2.0.0 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --extra proof
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked soroemono release
      - run: |
          for style in Regular Bold Italic "Bold Italic"; do
            uv run --locked soroemono build --style "$style"
            uv run --locked soroemono check --style "$style"
          done
      - run: uv run --locked soroemono fetch-baseline
      - run: |
          for style in Regular Bold Italic "Bold Italic"; do
            uv run --locked soroemono proof --style "$style"
          done
      - run: uv run --locked playwright install --with-deps chromium
      - run: |
          for proof in regular bold italic bold-italic; do
            uv run --locked soroemono capture --proof "build/proofs/$proof"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: soroemono-2.0.0-linux
          path: |
            dist/
            build/formal/
            build/proofs/
          if-no-files-found: error
          retention-days: 14
